name: RAG Fullstack CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: rag-fullstack-docker-aws
  AWS_REGION: us-east-1
  EC2_INSTANCE_ID: i-04997c6b8e05b1870

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    name: Build & Test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run linting
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run unit tests
        run: |
          pytest tests/ -v --cov=. --cov-report=xml --cov-report=term

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

  build-docker:
    needs: build-and-test
    runs-on: ubuntu-latest
    name: Build & Push Docker Image
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-ec2:
    needs: build-docker
    runs-on: ubuntu-latest
    name: Deploy to AWS EC2
    # Disabled on push: the deploy auto-targets EC2_INSTANCE_ID, and we are
    # moving to a brand-new instance. Run manually (Actions -> Run workflow)
    # only AFTER updating EC2_INSTANCE_ID to the new box.
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get EC2 instance public IP
        id: get-ip
        run: |
          EC2_IP=$(aws ec2 describe-instances \
            --instance-ids ${{ env.EC2_INSTANCE_ID }} \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)
          echo "ec2_ip=$EC2_IP" >> $GITHUB_OUTPUT
          echo "EC2 Instance IP: $EC2_IP"

      - name: Deploy Docker container to EC2
        env:
          EC2_USER: ubuntu
          EC2_IP: ${{ steps.get-ip.outputs.ec2_ip }}
          DOCKER_IMAGE: ${{ env.REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          SSH_KEY_B64: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY_B64" | base64 -d > ~/.ssh/aws-key.pem
          chmod 600 ~/.ssh/aws-key.pem

          # Add EC2 to known_hosts
          ssh-keyscan -H "$EC2_IP" 2>/dev/null >> ~/.ssh/known_hosts || true

          # Deploy with SSH
          ssh \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o IdentityFile=~/.ssh/aws-key.pem \
            "$EC2_USER@$EC2_IP" << 'ENDDEPLOY'
          set -e

          # t3.micro has only 1 GB RAM. Add 4 GB swap (idempotent) or the
          # backend is OOM-killed when PyTorch loads the embedding model.
          if ! sudo swapon --show | grep -q '/swapfile'; then
            sudo fallocate -l 4G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=4096
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
            grep -q '/swapfile' /etc/fstab || echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
            sudo sysctl vm.swappiness=10
          fi
          free -h

          # Tear down any previous deployment FIRST so it releases the ports.
          docker rm -f rag-backend rag-frontend 2>/dev/null || true
          for p in 9000 9501; do
            cid=$(docker ps -q --filter "publish=$p")
            [ -n "$cid" ] && docker rm -f $cid || true
          done

          # Reclaim space from old images/layers before pulling.
          docker image prune -af || true
          docker builder prune -af 2>/dev/null || true
          df -h / | tail -1

          docker pull amith98480/rag-fullstack-docker-aws:latest

          # Backend gets most of the memory (it loads torch); allow spill to swap.
          docker run -d \
            --name rag-backend \
            -p 9000:8000 \
            --restart unless-stopped \
            --memory 700m \
            --memory-swap 3g \
            -e GROQ_API_KEY="${{ secrets.GROQ_API_KEY }}" \
            -e OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
            -e TAVILY_API_KEY="${{ secrets.TAVILY_API_KEY }}" \
            -e ENVIRONMENT="production" \
            -e OMP_NUM_THREADS="1" \
            -e TOKENIZERS_PARALLELISM="false" \
            amith98480/rag-fullstack-docker-aws:latest \
            python -m uvicorn backend.main:app --host 0.0.0.0 --port 8000

          # Frontend kept lean; it is just the Streamlit UI.
          docker run -d \
            --name rag-frontend \
            -p 9501:8501 \
            --restart unless-stopped \
            --memory 250m \
            --memory-swap 1g \
            -e API_URL="http://${{ steps.get-ip.outputs.ec2_ip }}:9000" \
            -e STREAMLIT_BROWSER_GATHER_USAGE_STATS="false" \
            -e STREAMLIT_SERVER_FILE_WATCHER_TYPE="none" \
            amith98480/rag-fullstack-docker-aws:latest \
            streamlit run frontend/app.py --server.port 8501 --server.address 0.0.0.0

          sleep 8
          docker ps -a | grep -E "rag-backend|rag-frontend"

          # Fail the deploy if either container is not actually running.
          for c in rag-backend rag-frontend; do
            state=$(docker inspect -f '{{.State.Status}}' $c 2>/dev/null || echo missing)
            echo "$c -> $state"
            if [ "$state" != "running" ]; then
              echo "ERROR: $c is not running ($state). Logs:"
              docker logs --tail 30 $c 2>&1 || true
              exit 1
            fi
          done
          ENDDEPLOY

          rm ~/.ssh/aws-key.pem

      - name: Verify API is responsive
        env:
          EC2_IP: ${{ steps.get-ip.outputs.ec2_ip }}
        run: |
          echo "Waiting for API to be ready..."
          for i in {1..30}; do
            if curl -s http://${{ steps.get-ip.outputs.ec2_ip }}:9000/health > /dev/null; then
              echo "✓ RAG API is ready"
              exit 0
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done
          echo "✗ RAG API failed to respond"
          exit 1

      - name: Create deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✓ Deployment successful"
            echo "RAG Backend: http://${{ steps.get-ip.outputs.ec2_ip }}:9000"
            echo "RAG Frontend: http://${{ steps.get-ip.outputs.ec2_ip }}:9501"
          else
            echo "✗ Deployment failed"
            exit 1
          fi
